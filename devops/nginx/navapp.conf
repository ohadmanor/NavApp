# NavApp — Production Nginx Configuration (Any Cloud / VPS / Docker)
#
# Serves:
#   /       -> Vite production build (devops/dist/) with SPA fallback
#   /data/  -> Map data directory (data/) with HTTP 206 byte-range streaming for PMTiles
#
# Build the app for self-hosted Nginx with:
#   VITE_DATA_ORIGIN=same-origin (in .env, and remove/comment VITE_DEM_PMTILES_URL)
#   npm run build
#
# Copy devops/dist/* to /var/www/navapp/dist/ and data/* to /var/www/navapp/data/

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/navapp/dist;
    index index.html;

    # Enable gzip for text/JSON/JS/CSS/GeoJSON/Search index (never for .pmtiles)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/geo+json
        image/svg+xml
        application/octet-stream;

    # Map data files (Israel.dem.pmtiles, Israel.osm.pmtiles, Israel.pois.geojson, Israel.search.idx)
    location /data/ {
        alias /var/www/navapp/data/;
        autoindex off;

        # Required for MapLibre + PMTiles HTTP 206 byte-range streaming
        add_header Accept-Ranges bytes always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-Match, Content-Type" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # Never compress PMTiles (breaks byte-range offsets)
        location ~* \.pmtiles$ {
            gzip off;
            add_header Accept-Ranges bytes always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, If-Match, Content-Type" always;
            add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;
            add_header Cache-Control "public, max-age=86400" always;
        }

        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Never cache index.html or Service Worker aggressively
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    # Hashed Vite assets can be cached long-term
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback (excludes /data/ and /assets/; also serves /osm-sync and /osm-callback — configure HTTPS for non-localhost OSM OAuth2)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
